description: Granite-3B-Code-Base-128K extends the context length of Granite-3B-Code-Base from 2K to 128K with continual pretraining. It is a 3B parameter model trained on code data from 116 programming languages, intended for enterprise software engineering tasks like code generation, explanation, and fixing. The model is marked as deprecated for new projects in favor of newer Granite models.
description_cn: Granite-3B-Code-Base-128K 通过持续预训练将 Granite-3B-Code-Base 的上下文长度从 2K 扩展至 128K。这是一个 3B 参数模型，使用来自 116 种编程语言的数据进行训练，旨在执行代码生成、解释和修复等企业软件工程任务。该模型已被标记为弃用，建议新项目使用更新的 Granite 模型。
