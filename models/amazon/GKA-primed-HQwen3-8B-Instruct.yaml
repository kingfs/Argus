description: GKA-primed-HQwen3-8B-Instruct is a hybrid causal language model with 50% Attention and 50% Gated KalmaNet (GKA) layers, primed from Qwen3-8B. It is instruction-tuned, supports context lengths up to 128K tokens, and is not a thinking model (does not natively produce chain-of-thought). Tool calling is not supported by this checkpoint.
description_cn: GKA-primed-HQwen3-8B-Instruct 是一种混合自回归语言模型，包含 50% 注意力层和 50% 门控 KalmaNet（GKA）层，基于 Qwen3-8B 预热训练。该模型经过指令微调，支持长达 128K 标记的上下文，且非思考模型（不原生生成思维链）。此检查点不支持工具调用。
