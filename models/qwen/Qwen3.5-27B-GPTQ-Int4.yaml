description: GPTQ int4-quantized model weights and configuration files for the Qwen3.5-27B post-trained model. The model is a Causal Language Model with a Vision Encoder, supporting 262,144 context length natively. It features a hybrid architecture with Gated Delta Networks and sparse Mixture-of-Experts, and supports 201 languages.
