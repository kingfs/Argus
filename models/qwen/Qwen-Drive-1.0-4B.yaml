description: Qwen-Drive-1.0 is a vision-language foundation model for autonomous driving that unifies 3D perception, visual question answering, and motion planning. It retains the architecture of the pretrained Qwen3.5 vision-language model and integrates a BEV perception head for 3D object detection, semantic occupancy prediction, and BEV map segmentation, alongside a Planning Expert for ego trajectory generation.
description_cn: Qwen-Drive-1.0 是一款面向自动驾驶的视觉-语言基础模型，统一了 3D 感知、视觉问答和运动规划功能。该模型保留了 Qwen3.5 预训练视觉-语言模型的架构，集成了用于 3D 目标检测、语义占据预测和 BEV 地图分割的 BEV 感知头，以及用于自车轨迹生成的规划专家模块。
